services:
  web:
    container_name: monopoly-client
    image: node:24-alpine
    working_dir: /app/web
    volumes:
      - .:/app/web
      - /app/web/node_modules # Tránh xung đột thư viện giữa Mac/Win/Linux
    ports:
      - "5173:5173"
    environment:
      - CHOKIDAR_USEPOLLING=true # Để máy Windows sửa code tự reload
      - WATCHPACK_POLLING=true
    command: sh -c "npm install && npm run dev -- --host"
